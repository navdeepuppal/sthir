<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1214">
<title>Sthir — NSE Swing Research</title>
<style>
:root{
  --bg:#0e1214; --panel:#151a1d; --panel2:#1b2125; --line:#273036; --text:#e6ebee; --muted:#8b979f; --faint:#5d6870;
  --accent:#3fc98a; --accent-ink:#06261a; --warn:#e8b04a; --bad:#ef6461; --info:#6ea8ff;
  --r:14px; --pad:16px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI Variable", "Segoe UI", system-ui, Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f3f5f4; --panel:#ffffff; --panel2:#f7f9f8; --line:#dfe5e3; --text:#14201b; --muted:#5d6b66; --faint:#8a9893; --accent:#13955d; --accent-ink:#ffffff; --warn:#a86b00; --bad:#c8312e; --info:#2c62c9; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,.kpi b{font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
nav.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-weight:800;font-size:15px}
.brand b{font-size:17px;letter-spacing:.2px}.brand small{display:block;color:var(--muted);font-size:11.5px;margin-top:-2px}
.navbtn{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:10px;color:var(--muted);cursor:pointer;text-align:left;font-weight:550}
.navbtn svg{width:19px;height:19px;flex:none}
.navbtn:hover{background:var(--panel2);color:var(--text)}
.navbtn.on{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.side .foot{margin-top:auto;color:var(--faint);font-size:12px;padding:8px}
main{padding:28px 32px 60px;max-width:1240px;width:100%}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:24px;margin:0;letter-spacing:-.2px}
h2{font-size:16px;margin:0 0 12px}
h3{font-size:14px;margin:18px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:650}
.sub{color:var(--muted);font-size:13.5px;margin-top:3px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);margin-bottom:14px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.kpi span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b{display:block;font-size:19px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi i{font-style:normal;font-size:12px;color:var(--faint)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:650;border:1px solid var(--line);background:var(--panel2);white-space:nowrap}
.pill.good{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.pos{color:var(--accent)}.neg{color:var(--bad)}.muted{color:var(--muted)}.warnc{color:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel2);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;min-height:40px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.sm{padding:6px 10px;min-height:32px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 calc(var(--pad)*-1);padding:0 var(--pad)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13.5px;border:1px solid}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 9%,transparent)}
.banner.bad{border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.banner.info{border-color:color-mix(in srgb,var(--info) 40%,transparent);background:color-mix(in srgb,var(--info) 8%,transparent)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;color:var(--muted)}
.field input,.field select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-height:40px;width:100%}
.fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:1px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.steps li{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:13.5px}
.steps .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none;border:1.5px solid var(--line);color:var(--muted)}
.steps .ok .ic{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps .wait .ic{border-color:var(--warn);color:var(--warn)}
.chart{width:100%;overflow:hidden}
.chart svg{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.prose{max-width:820px}
.prose p,.prose li{color:var(--text)}
.prose li{margin:4px 0}
.prose .lead{font-size:16px}
.callout{border-left:3px solid var(--accent);padding:4px 0 4px 14px;margin:14px 0}
.callout.warn{border-color:var(--warn)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.bar{height:6px;border-radius:4px;background:var(--panel2);overflow:hidden;margin-top:6px}
.bar > div{height:100%;background:var(--accent)}
.bar.warn > div{background:var(--warn)}.bar.bad > div{background:var(--bad)}
.prog{height:4px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:10px 0}
.prog div{height:100%;background:var(--accent);width:0;transition:width .2s}
.tabbar{display:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:50;padding:18px}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:520px;width:100%;padding:20px;max-height:85vh;overflow:auto}
.dialog h2{margin-bottom:8px}
.dialog td{white-space:normal}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;font-weight:600;max-width:90vw}
code,.mono{font-family:var(--mono);font-size:12.5px}
pre{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-size:12px;line-height:1.5;max-height:340px}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
.drop.hover{border-color:var(--accent);color:var(--accent)}
.split{display:flex;justify-content:space-between;gap:10px;align-items:center}
.small{font-size:12.5px}
details summary{cursor:pointer;color:var(--muted);font-weight:600;padding:6px 0}
.cmpt td:first-child{color:var(--muted)}
@media (max-width: 1000px){ .fields{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:1fr 1fr} }
@media (max-width: 820px){
  .shell{display:block}
  nav.side{display:none}
  main{padding:calc(14px + env(safe-area-inset-top)) max(14px, env(safe-area-inset-left)) calc(96px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-right))}
  h1{font-size:21px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.g3{grid-template-columns:1fr}
  .kpi b{font-size:17px}
  :root{--pad:14px}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);padding:5px 0;font-weight:600;cursor:pointer}
  .tabbar svg{width:22px;height:22px}
  .tabbar button.on{color:var(--accent)}
  .hide-m{display:none}
}
</style>
</head>
<body>
<div class="shell">
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>
<nav class="tabbar" id="tabbar"></nav>
<script>
/* ===================== Sthir engine (pure logic, no DOM) ===================== */
'use strict';

const DEFAULTS = {
  // capital & portfolio limits
  capital: 1000000, riskPct: 0.20, maxPos: 5, maxAllocPct: 10, maxDeployPct: 50, maxOpenRiskPct: 1.0,
  maxPerSector: 2, useCorr: true, corrMax: 0.80,
  // stops & exits
  atrMult: 2.0, exitMode: 'fixed', targetR: 2.0, trailMult: 3.0, maLen: 20, timeStop: 20, maxChaseATR: 1.0,
  // eligibility
  minPrice: 50, minADVcr: 5, participationPct: 2,
  // execution costs
  slipPct: 0.10, halfSpreadPct: 0.05, gapExtraPct: 0.25,
  brokPct: 0, brokCap: 20, dpCharge: 15.93, sttPct: 0.1, stampPct: 0.015, exchPct: 0.00297, sebiPct: 0.0001, gstPct: 18,
  // cash & tax
  idleInterest: true, cashRatePct: 6.0, stcgPct: 20.8, slabPct: 31.2,
  // strategy
  strategy: 'pullback',
  f_quality: true, f_regime: true, f_close50: true, f_50over200: true, f_200rising: true, f_pullback: true, f_confirm: true, f_rsi: true,
  pbTolPct: 1.0, rsiLo: 45, rsiHi: 65, boLen: 55, boVolMult: 1.5, rsTopPct: 10,
  // research splits
  trainPct: 50, valPct: 25,
  regimeSym: '', benchSym: '', exclude: ''
};

const STRATS = {
  pullback: 'Trend pullback (your rules)',
  breakout: 'Breakout + volume',
  rs: 'Relative-strength momentum'
};
const EXITS = { fixed: 'Fixed stop + target', atr_trail: 'ATR trailing stop', ma: 'Moving-average exit' };

const ENG = { DATA: null, IND: null, UNIV: [], REG: null, EXCL: new Set(), indKey: '' };

/* ---------- CSV ---------- */
function splitQuoted(line) {
  const out = []; let f = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (q) { if (ch === '"') { if (line[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true; else if (ch === ',') { out.push(f); f = ''; } else f += ch;
  }
  out.push(f); return out;
}
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const lines = text.split(/\r?\n/), rows = [];
  for (const ln of lines) { if (!ln.trim()) continue; rows.push(ln.indexOf('"') < 0 ? ln.split(',') : splitQuoted(ln)); }
  return rows;
}
const MON = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
const p2 = n => (n < 10 ? '0' : '') + n;
function parseDate(s) {
  s = String(s || '').trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return m[1] + '-' + p2(+m[2]) + '-' + p2(+m[3]);
  m = s.match(/^(\d{1,2})[-\/ ]([A-Za-z]{3})[A-Za-z]*[-\/ ,]+(\d{2,4})$/);
  if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; const mo = MON[m[2].toLowerCase()]; if (mo) return y + '-' + p2(mo) + '-' + p2(+m[1]); }
  m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/); if (m) return m[3] + '-' + p2(+m[2]) + '-' + p2(+m[1]); // DD-MM-YYYY (India)
  m = s.match(/^(\d{4})(\d{2})(\d{2})$/); if (m) return m[1] + '-' + m[2] + '-' + m[3];
  return null;
}
const num = s => { if (s == null) return NaN; const v = parseFloat(String(s).replace(/[,₹\s]/g, '')); return v; };
function cleanSym(s) { return String(s || '').trim().toUpperCase().replace(/\.(NS|BO|NSE)$/, '').replace(/^\^/, ''); }

/** Classify and parse one CSV file. Returns {kind, rows|map, note} */
function parseFile(name, text) {
  const rows = parseCSV(text); if (rows.length < 2) return { kind: 'empty', note: name + ': no rows' };
  const hdr = rows[0].map(h => h.trim().toLowerCase().replace(/\s+/g, ' '));
  const find = (...alts) => { for (const a of alts) { const i = hdr.findIndex(h => h === a); if (i >= 0) return i; } for (const a of alts) { const i = hdr.findIndex(h => h.includes(a)); if (i >= 0) return i; } return -1; };
  const iSym = find('symbol', 'ticker', 'tradingsymbol', 'scrip'), iDate = find('date', 'timestamp', 'datetime');
  const iSector = find('sector', 'industry');
  const iFrom = find('from', 'start', 'added', 'included'), iTo = find('to', 'end', 'removed', 'excluded');
  if (iSym >= 0 && iSector >= 0 && iDate < 0) {
    const map = {}; for (let r = 1; r < rows.length; r++) { const s = cleanSym(rows[r][iSym]); if (s) map[s] = (rows[r][iSector] || '').trim() || 'Unknown'; }
    return { kind: 'sectors', map, note: name + ': sector map for ' + Object.keys(map).length + ' symbols' };
  }
  if (iSym >= 0 && iFrom >= 0 && iDate < 0) {
    const map = {}; let n = 0;
    for (let r = 1; r < rows.length; r++) { const s = cleanSym(rows[r][iSym]); const f = parseDate(rows[r][iFrom]); const t = iTo >= 0 ? parseDate(rows[r][iTo]) : null; if (!s || !f) continue; (map[s] = map[s] || []).push([f, t || '9999-12-31']); n++; }
    return { kind: 'membership', map, note: name + ': ' + n + ' membership ranges (point-in-time universe)' };
  }
  if (iDate < 0) return { kind: 'unknown', note: name + ': no Date column found — skipped' };
  const iAdj = find('adj close', 'adj_close', 'adjclose');
  let iC = hdr.findIndex(h => h === 'close' || h === 'close price' || h === 'closing price' || h === 'close_price');
  if (iC < 0) iC = find('total returns index', 'tri', 'close', 'ltp', 'last');
  const iO = find('open', 'open price'), iH = find('high', 'high price'), iL = find('low', 'low price');
  const iV = find('volume', 'shares traded', 'tottrdqty', 'ttl_trd_qnty', 'qty');
  const iSer = find('series');
  if (iC < 0 && iAdj < 0) return { kind: 'unknown', note: name + ': no Close column — skipped' };
  const stem = cleanSym(name.replace(/\.[^.]+$/, '').replace(/[^A-Za-z0-9&\-^._ ]/g, '').trim().replace(/\s+/g, ''));
  const map = {}; let bad = 0;
  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];
    if (iSer >= 0) { const se = (row[iSer] || '').trim().toUpperCase(); if (se && se !== 'EQ' && se !== 'BE') continue; }
    const d = parseDate(row[iDate]); if (!d) { bad++; continue; }
    const sym = iSym >= 0 ? cleanSym(row[iSym]) : stem; if (!sym) { bad++; continue; }
    let c = iC >= 0 ? num(row[iC]) : num(row[iAdj]);
    let o = iO >= 0 ? num(row[iO]) : c, h = iH >= 0 ? num(row[iH]) : c, l = iL >= 0 ? num(row[iL]) : c;
    if (iAdj >= 0 && iC >= 0) { const a = num(row[iAdj]); if (a > 0 && c > 0) { const k = a / c; o *= k; h *= k; l *= k; c = a; } }
    if (!(o > 0)) o = c; if (!(h > 0)) h = Math.max(o, c); if (!(l > 0)) l = Math.min(o, c);
    const v = iV >= 0 ? num(row[iV]) : NaN;
    (map[sym] = map[sym] || []).push([d, o, h, l, c, v]);
  }
  const syms = Object.keys(map);
  return { kind: 'prices', map, note: name + ': ' + syms.length + ' symbol(s), ' + (rows.length - 1) + ' rows' + (bad ? ', ' + bad + ' unreadable rows' : '') };
}

/* ---------- Dataset build & validation ---------- */
const INDEX_RE = /NIFTY|NSEI|SENSEX|INDEX|TRI$|^CNX/i;
function guessIndexSyms(keys) {
  const reg = keys.find(k => /^(NIFTY ?50|NIFTY50|NSEI|NIFTY)$/i.test(k)) || keys.find(k => /NIFTY.?50/i.test(k) && !/TRI/i.test(k)) || keys.find(k => INDEX_RE.test(k)) || '';
  const bench = keys.find(k => /200/.test(k) && /TRI/i.test(k)) || keys.find(k => /TRI/i.test(k)) || keys.find(k => /200/.test(k) && INDEX_RE.test(k)) || reg;
  return { reg, bench };
}

function buildDataset(raw, extra) {
  // raw: {SYM: [[d,o,h,l,c,v],...]}
  const keys = Object.keys(raw);
  const g = guessIndexSyms(keys);
  const regSym = (extra.regimeSym && raw[extra.regimeSym]) ? extra.regimeSym : g.reg;
  let dateSet;
  if (regSym && raw[regSym] && raw[regSym].length > 300) dateSet = new Set(raw[regSym].map(r => r[0]));
  else { dateSet = new Set(); for (const k of keys) for (const r of raw[k]) dateSet.add(r[0]); }
  const dates = [...dateSet].sort(); const n = dates.length; const pos = new Map(dates.map((d, i) => [d, i]));
  const syms = {}; const val = { issues: [], perSym: {}, totals: { dup: 0, ohlc: 0, offCal: 0, gaps: 0, zeroVol: 0, jumps: 0, stale: 0 } };
  for (const k of keys) {
    const arr = raw[k].slice().sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0);
    const o = new Float64Array(n).fill(NaN), h = new Float64Array(n).fill(NaN), l = new Float64Array(n).fill(NaN), c = new Float64Array(n).fill(NaN), v = new Float64Array(n).fill(NaN);
    const st = { dup: 0, ohlc: 0, offCal: 0, gaps: 0, zeroVol: 0, jumps: 0 };
    let prevD = null;
    for (const r of arr) {
      if (r[0] === prevD) { st.dup++; continue; } prevD = r[0];
      const i = pos.get(r[0]); if (i === undefined) { st.offCal++; continue; }
      let [, O, H, L, C, V] = r;
      if (!(C > 0)) { st.ohlc++; continue; }
      if (H < L || C > H * 1.001 || C < L * 0.999 || O > H * 1.001 || O < L * 0.999) { st.ohlc++; H = Math.max(O, H, L, C); L = Math.min(O, H, L, C); }
      o[i] = O; h[i] = H; l[i] = L; c[i] = C; v[i] = V;
    }
    let first = -1, last = -1; for (let i = 0; i < n; i++) if (c[i] > 0) { if (first < 0) first = i; last = i; }
    if (first < 0) continue;

<tr><td>0.2R (good)</td><td class="n">+1.2%</td><td class="n">+2.0%</td><td class="n">+1.0–1.6%</td></tr>
<tr><td>0.3R (very good, rare)</td><td class="n">+1.8%</td><td class="n">+3.0%</td><td class="n">+1.4–2.4%</td></tr>
</tbody></table></div>
<p>The other 75–90% of capital sits in cash. In a liquid fund or T-bills it earns a few percent, taxed at your slab rate. So the realistic total is "liquid-fund return plus 0–2%", well below what large-cap equities have returned over long periods — but with far smaller drawdowns. That is a valid choice for capital preservation, but call it what it is.</p>

<h3>2 · Transaction costs and tax</h3>
<p>Current delivery charges: STT 0.1% on both buy and sell, stamp duty 0.015% on the buy, NSE transaction charge 0.00297%, SEBI ₹10 per crore, 18% GST on brokerage and exchange charges, and a DP charge of about ₹16 per sell. Many discount brokers charge zero brokerage on delivery.</p>
<div class="tw"><table><thead><tr><th>Round trip on ₹40,000</th><th class="n">₹</th></tr></thead><tbody>
<tr><td>Statutory charges + DP (zero brokerage)</td><td class="n">≈ 105</td></tr>
<tr><td>Slippage + half-spread, 0.15% each side (assumption)</td><td class="n">≈ 120</td></tr>
<tr><td><b>Total</b></td><td class="n"><b>≈ 225 (0.56%)</b></td></tr>
<tr><td>As a fraction of ₹2,000 risk</td><td class="n"><b>≈ 0.11R</b></td></tr>
</tbody></table></div>
<p><b>Costs eat about 0.1R of every trade.</b> A strategy needs a gross edge above 0.1R just to break even. Tighter stops make it worse: a 1×ATR stop doubles the cost in R terms. Short-term gains are taxed at 20% plus cess, and only net gains within a financial year are taxed (losses offset gains).</p>

<h3>3 · Strategy comparison</h3>
<div class="tw"><table><thead><tr><th>Approach</th><th>Idea</th><th>Evidence base</th><th>Trade frequency</th><th>Main failure mode</th><th>Cost sensitivity</th></tr></thead><tbody>
<tr><td><b>A · Trend pullback</b> (your rules)</td><td>Buy a dip to the 20-EMA inside an established uptrend</td><td>Weak to moderate. Trend persistence is documented, but buying short-term dips adds a mean-reversion bet whose edge in liquid large caps is small and often consumed by costs</td><td>Medium (8 filters stacked → few signals)</td><td>Many filters = high overfitting risk; dips in a turning market become falling knives; frequent small stop-outs</td><td>High (short holds, tight stops)</td></tr>
<tr><td><b>B · Breakout + volume</b></td><td>Buy closes above a multi-week high on heavy volume</td><td>Moderate. Linked to the well-studied "52-week-high" and time-series momentum effects</td><td>Low–medium</td><td>False breakouts; buying after a gap-up raises slippage; poor in choppy markets</td><td>Medium</td></tr>
<tr><td><b>C · Relative-strength momentum</b></td><td>Each week, hold the strongest 6-month performers that are in uptrends</td><td>Strongest of the three. Cross-sectional momentum is one of the most replicated anomalies globally and in India (NSE publishes momentum factor indices)</td><td>Low (weekly rebalance)</td><td>Momentum crashes at sharp market reversals (e.g. 2008, March 2020); needs a regime filter</td><td>Lower (longer holds)</td></tr>
<tr><td><b>Baseline · Buy & hold index</b></td><td>Nifty 200 TRI / index fund</td><td>Market return</td><td>None</td><td>Deep drawdowns (30–60% historically)</td><td>Minimal</td></tr>
<tr><td><b>Baseline · Cash</b></td><td>Liquid fund / T-bills</td><td>Near risk-free</td><td>None</td><td>Inflation and tax drag</td><td>None</td></tr>
</tbody></table></div>
<p><b>Prior expectation (to be tested, not believed):</b> C is most likely to survive out-of-sample, B second, A least — because A has the most parameters and the shortest holding period. The app runs all three on identical costs, limits and exits so the comparison is fair. Market-regime filtering and volatility-based sizing (stop = ATR multiple) are built into all of them.</p>

<h3>4 · Biggest failure modes</h3>
<ol>
<li><b>Survivorship bias.</b> Testing on today's Nifty 200 means testing on companies that are known to have survived and grown. This alone can turn a losing strategy into a winning backtest. Fix: point-in-time membership file (NSE Indices publishes semi-annual rebalancing changes) and data that includes delisted stocks.</li>
<li><b>Overfitting / multiple testing.</b> Eight filters, each with a threshold, give thousands of combinations. Some will look excellent by luck — on the synthetic random data in this app you will find settings that look "profitable". Fix: few parameters, chronological splits, walk-forward, an untouched holdout used once, and the t-stat gate.</li>
<li><b>Small samples.</b> With 5 slots you may get 30–60 trades a year. Profit factor and win rate from fewer than ~100 trades have wide error bars. Fix: judge on several years and on R-expectancy with its t-statistic.</li>
<li><b>Gap risk.</b> A stop is not a guarantee. Results, block deals, regulatory news or market shocks can open a stock 5–15% below your stop, and a lower-circuit stock may not be sellable at all. A single gap can cost 2–4R. The backtester sells at the gap open plus extra slippage and refuses fills on locked days.</li>
<li><b>Regime dependence.</b> Long-only trend systems make most of their money in bull markets and bleed in sideways ones. Fix: regime filter and per-regime reporting; accept long periods in cash.</li>
<li><b>Look-ahead bias.</b> Using the signal-day close as the entry price, or using data that was revised later. The engine only trades at the next open and computes indicators from past bars only.</li>
<li><b>Data quality.</b> Free data has unadjusted splits/bonuses, gaps and stale symbols. Validation flags >30% one-day moves and missing bars, but cannot repair them.</li>
<li><b>Costs and slippage underestimated.</b> Using zero slippage makes almost any short-term system look good. Run every candidate again with doubled costs; if it fails, it has no margin of safety.</li>
<li><b>Behaviour.</b> Skipping signals after losses, closing winners early, or overriding stops destroys any small edge. The paper journal records manual overrides separately.</li>
<li><b>Opportunity cost.</b> Being mostly in cash during a strong bull market feels bad and tempts rule changes. Decide in advance that you accept this.</li>
</ol>

<h3>5 · Data requirements</h3>
<div class="tw"><table><thead><tr><th>Need</th><th>Good-enough for learning</th><th>Needed before real money</th></tr></thead><tbody>
<tr><td>Adjusted daily OHLCV</td><td>Yahoo via the script in Setup</td><td>NSE bhavcopies with your own corporate-action adjustment, or a paid authorised vendor</td></tr>
<tr><td>Point-in-time constituents</td><td>Not available free in a ready file</td><td>Build from NSE Indices rebalancing announcements (Symbol, From, To)</td></tr>
<tr><td>Delisted / removed stocks</td><td>Missing from Yahoo</td><td>Paid vendor or NSE archives</td></tr>
<tr><td>Benchmark</td><td>Nifty 50 price index (understates by the dividend yield)</td><td>Nifty 200 TRI from niftyindices.com</td></tr>
<tr><td>Restrictions</td><td>Manual exclusion list (ASM/GSM/T2T)</td><td>Dated history of surveillance lists</td></tr>
<tr><td>Cash benchmark</td><td>Fixed yield setting</td><td>Historical 91-day T-bill yields</td></tr>
</tbody></table></div>

<h3>6 · Acceptance criteria (stricter than your initial gates)</h3>
<p>A strategy moves to paper trading only if <b>all</b> of these hold on Validation <i>and</i> on stitched walk-forward results, with costs as set:</p>
<ul>
<li>At least 100 out-of-sample trades in total.</li>
<li>Net expectancy ≥ +0.15R per trade after all costs, with t-statistic ≥ 2.</li>
<li>Profit factor > 1.3 out-of-sample.</li>
<li>Maximum drawdown < 6% <i>and</i> still positive when slippage is doubled.</li>
<li>Still profitable after removing the 5 best trades.</li>
<li>Positive in at least two of bull / sideways / bear periods, and no catastrophic regime.</li>
<li>Results do not collapse when the stop multiple or lookbacks are moved ±20% (no "cliff").</li>
<li>Walk-forward picks similar settings in most years.</li>
<li>Whole-portfolio post-tax return beats keeping everything in cash.</li>
<li>The holdout is run once, at the end, and is not used to choose anything.</li>
</ul>
<p>Then at least 3–6 months of paper trading, with live fills compared against the backtest's assumptions, before any real money.</p>

<h3>7 · What this app does and does not do</h3>
<ul>
<li>Runs entirely in your browser; nothing is fetched from the internet and no order can be sent anywhere.</li>
<li>Daily bars only. Within one bar, if both the stop and the target are touched, it assumes the stop came first (conservative).</li>
<li>Tax is an estimate per financial year; it ignores surcharge slabs and set-off against other income.</li>
<li>Without a membership file and delisted-stock data, every backtest is biased upward. The app shows this warning until you fix it.</li>
</ul>

<h3>8 · Recommendation</h3>
<p>Proceed to Phase 2 (exact rules) only on the understanding that the likely outcome is a <b>small, possibly zero</b> improvement over cash, and that rejecting all three strategies is an acceptable result. The rules are already encoded as editable defaults in this app so you can see them work. The next real step is data: get Nifty 200 history plus a point-in-time membership file, then run Compare → Test each filter → Walk-forward, and only then the holdout.</p>
`;

function niceStep(r) { const e = Math.pow(10, Math.floor(Math.log10(r))); const f = r / e; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * e; }
function chartSVG(sp, W) {

  let lo = Math.min(...all), hi = Math.max(...all); if (sp.zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); } if (hi === lo) { hi += 1; lo -= 1; }
  const pd = (hi - lo) * 0.05; if (!(sp.zero && hi === 0)) hi += pd; lo -= pd;

  const yrs = []; for (let i = 1; i < n; i++) if (sp.dates[i].slice(0, 4) !== sp.dates[i - 1].slice(0, 4)) yrs.push(i);
  const every = Math.max(1, Math.ceil(yrs.length / Math.max(1, Math.floor((W - pl) / 64))));
  yrs.forEach((i, j) => { if (j % every) return; g += `<text x="${X(i)}" y="${H - 6}" text-anchor="middle" font-size="11" style="fill:var(--faint)">${sp.dates[i].slice(0, 4)}</text><line x1="${X(i)}" x2="${X(i)}" y1="${H - pb}" y2="${H - pb + 4}" style="stroke:var(--line)"/>`; });
  if (!yrs.length) { g += `<text x="${pl}" y="${H - 6}" font-size="11" style="fill:var(--faint)">${fmtDate(sp.dates[0])}</text><text x="${W - pr}" y="${H - 6}" text-anchor="end" font-size="11" style="fill:var(--faint)">${fmtDate(sp.dates[n - 1])}</text>`; }

function lastT() { return ENG.DATA ? ENG.DATA.dates.length - 1 : -1; }

function candidatesToday(ps) {

  ${S.strategy === 'pullback' ? `<h3>Pullback filters — switch any off to test it</h3><div class="grid g2" style="gap:0 14px">${chkField('f_regime', 'Nifty 50 above 200-day SMA')}${chkField('f_quality', 'Liquidity, price & event filters')}${chkField('f_close50', 'Close above 50-day SMA')}${chkField('f_50over200', '50-day SMA above 200-day SMA')}${chkField('f_200rising', '200-day SMA rising over 20 sessions')}${chkField('f_pullback', 'Pullback to 20-day EMA', 'Low of last 3 sessions within ' + S.pbTolPct + '% of the EMA')}${chkField('f_confirm', 'Close above previous day high')}${chkField('f_rsi', 'RSI(14) between ' + S.rsiLo + ' and ' + S.rsiHi)}</div>` : `<div class="grid g2" style="gap:0 14px;margin-top:8px">${chkField('f_regime', 'Nifty 50 above 200-day SMA')}${chkField('f_quality', 'Liquidity, price & event filters')}</div>`}
  <h3>Chronological split</h3><div class="small"><span class="tag">Train</span> ${fmtDate(D.dates[sp.train[0]])} → ${fmtDate(D.dates[sp.train[1]])} &nbsp; <span class="tag">Validation</span> ${fmtDate(D.dates[sp.val[0]])} → ${fmtDate(D.dates[sp.val[1]])} &nbsp; <span class="tag">Holdout test</span> ${fmtDate(D.dates[sp.test[0]])} → ${fmtDate(D.dates[sp.test[1]])} ${META.holdoutUnlocked ? `<span class="warnc">(opened ${META.holdoutRuns}×)</span>` : '🔒'}</div>
  <div class="prog" id="prog"><div></div></div>
  <div class="row"><button class="btn pri" data-act="run" ${BUSY ? 'disabled' : ''}>Run train + validation</button><button class="btn" data-act="compare" ${BUSY ? 'disabled' : ''}>Compare 3 strategies</button><button class="btn" data-act="ablate" ${BUSY ? 'disabled' : ''}>Test each filter</button><button class="btn" data-act="wf" ${BUSY ? 'disabled' : ''}>Walk-forward</button><button class="btn" data-act="holdout" ${BUSY ? 'disabled' : ''}>Holdout test ${META.holdoutUnlocked ? '' : '🔒'}</button></div></div>`;
  if (BT) {
    const segs = [{ name: 'Train', m: BT.train.m, r: BT.train.r }, { name: 'Validation', m: BT.val.m, r: BT.val.r }]; if (HOLD) segs.push({ name: 'Holdout', m: HOLD.m, r: HOLD.r });
    const cur = segs.find(s => s.name.toLowerCase().startsWith(BTSEG)) || segs[1]; const m = cur.m, r = cur.r;
    h += `<div class="card"><div class="split"><h2>Results · ${esc(STRATS[BT.P.strategy])} · ${esc(EXITS[BT.P.exitMode])}</h2></div>${metricTable(segs)}<p class="small muted">Post-tax estimate: STCG ${BT.P.stcgPct}% on each financial year's net realised gains, interest taxed at ${BT.P.slabPct}%. ${BT.P.idleInterest ? 'Idle cash earns ' + BT.P.cashRatePct + '% (liquid fund / T-bill proxy) — this is most of the return; look at "Trading P&L" for the strategy itself.' : ''}</p></div>`;
    h += `<div class="card"><div class="split"><h2>Equity · ${esc(cur.name)}</h2><div class="seg">${segs.map(s => `<button class="${s === cur ? 'on' : ''}" data-act="seg" data-v="${s.name.toLowerCase().slice(0, 3)}">${s.name}</button>`).join('')}</div></div>`;
    const series = [{ name: 'Strategy', vals: Array.from(r.eq, v => v / r.eq[0] - 1), color: 'var(--accent)', w: 2 }];
    if (m.bench) series.push({ name: m.bench.sym + ' buy & hold (price)', vals: Array.from(m.bench.series, v => v / m.bench.series[0] - 1), color: 'var(--info)', w: 1.4 });
    series.push({ name: 'Cash ' + BT.P.cashRatePct + '%', vals: Array.from(m.cashSeries, v => v / m.cashSeries[0] - 1), color: 'var(--faint)', dash: true });
    h += chart({ dates: r.dates, series, fmt: v => (v * 100).toFixed(0) + '%' });
    h += `<h3>Drawdown</h3>` + chart({ dates: r.dates, series: [{ name: 'Strategy drawdown', vals: ddSeries(r.eq), color: 'var(--bad)', area: true, w: 1.4 }], h: 140, zero: true, fmt: v => (v * 100).toFixed(1) + '%' });
    if (m.roll.length > 20) h += `<h3>Rolling 12-month return</h3>` + chart({ dates: r.dates.slice(252), series: [{ name: 'Rolling 12m', vals: m.roll, color: 'var(--accent)', area: true, w: 1.4 }], h: 140, zero: true, fmt: v => (v * 100).toFixed(0) + '%' });
    h += `</div>`;
    h += `<div class="grid g2"><div class="card"><h2>Acceptance gates · ${esc(cur.name)}</h2>${gateList(m)}<p class="small muted">Judge on Validation and walk-forward, not Train. A strategy that passes only on Train is curve-fitted.</p></div><div class="card"><h2>By market regime · ${esc(cur.name)}</h2><table class="cmpt"><thead><tr><th>Regime</th><th class="n">Days</th><th class="n">Ann. return</th><th class="n">Trades</th><th class="n">Exp.</th><th class="n">PF</th></tr></thead><tbody>${['bull', 'side', 'bear'].map(k => { const x = m.regime[k]; return `<tr><td>${k === 'bull' ? 'Bull' : k === 'bear' ? 'Bear' : 'Sideways'}</td><td class="n">${x.days}</td><td class="n">${SPCT(x.annRet)}</td><td class="n">${x.n}</td><td class="n">${N(x.expR)}R</td><td class="n">${N(x.pf)}</td></tr>`; }).join('')}</tbody></table>
      <h3>Exit reasons</h3><table class="cmpt"><tbody>${Object.entries(r.trades.reduce((a, x) => (a[x.reason] = (a[x.reason] || 0) + 1, a), {})).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="n">${v}</td></tr>`).join('')}</tbody></table>
      <h3>Dependence on best trades</h3><div class="small">Top 5 trades = <b>${Number.isFinite(m.top5Share) ? PCT(m.top5Share, 0) : '–'}</b> of net trading P&L. Without them: ${INR(m.tsRest.net)} (PF ${N(m.tsRest.pf)}).</div>
      <h3>Orders not taken</h3><div class="small muted">${Object.entries(m.skips).filter(([, v]) => v).map(([k, v]) => `${esc(k)}: ${v}`).join(' · ') || 'none'}</div></div></div>`;
    h += `<div class="card"><div class="split"><h2>Trades · ${esc(cur.name)} <span class="muted">(${r.trades.length})</span></h2><button class="btn sm" data-act="exporttrades">Export CSV</button></div><div class="tw"><table><thead><tr><th>Stock</th><th>Entry</th><th class="n">Price</th><th class="n">Qty</th><th>Exit</th><th class="n">Price</th><th>Reason</th><th class="n">P&L</th><th class="n">R</th><th class="n">Days</th></tr></thead><tbody>${r.trades.slice(-60).reverse().map(x => `<tr><td><b>${esc(x.sym)}</b>${x.partial ? ' <span class="tag" title="Size limited by ' + esc(x.partial) + '">capped</span>' : ''}</td><td>${fmtDate(x.entryDate)}</td><td class="n">${N(x.entry)}</td><td class="n">${x.qty}</td><td>${fmtDate(x.exitDate)}</td><td class="n">${N(x.exit)}</td><td class="small">${esc(x.reason)}</td><td class="n ${cls(x.pnl)}">${INR(x.pnl)}</td><td class="n ${cls(x.R)}">${N(x.R)}</td><td class="n">${x.bars}</td></tr>`).join('')}</tbody></table></div>${r.trades.length > 60 ? '<p class="small muted">Showing latest 60 — export for all.</p>' : ''}</div>`;
  }
  if (CMP) h += `<div class="card"><h2>Strategy comparison (same exits, costs and limits)</h2>${['Train', 'Validation'].map(seg => `<h3>${seg}</h3><div class="tw"><table><thead><tr><th>Strategy</th><th class="n">Return</th><th class="n">Max DD</th><th class="n">Trades</th><th class="n">PF</th><th class="n">Exp.</th><th class="n">t-stat</th><th class="n">Exposure</th><th class="n">Gates</th></tr></thead><tbody>${CMP.map(c => { const m = seg === 'Train' ? c.tr : c.va; const g = gates(m); return `<tr><td>${esc(STRATS[c.k])}</td><td class="n ${cls(m.tot)}">${SPCT(m.tot)}</td><td class="n">${PCT(m.dd, 2)}</td><td class="n">${m.n}</td><td class="n">${N(m.pf)}</td><td class="n">${N(m.expR)}R</td><td class="n">${N(m.tR)}</td><td class="n">${PCT(m.exposure)}</td><td class="n">${g.filter(x => x.pass).length}/${g.length}</td></tr>`; }).join('')}</tbody></table></div>`).join('')}<p class="small muted">Prefer the simplest strategy whose Validation results hold up — not the one with the highest Train return.</p></div>`;
  if (ABL) h += `<div class="card"><h2>Does each filter earn its place? (Train period only)</h2><div class="tw"><table><thead><tr><th>Variant</th><th class="n">Trades</th><th class="n">Exp.</th><th class="n">PF</th><th class="n">Max DD</th><th class="n">Δ expectancy</th></tr></thead><tbody>${ABL.map((a, i) => `<tr><td>${esc(a.name)}</td><td class="n">${a.m.n}</td><td class="n">${N(a.m.expR, 3)}R</td><td class="n">${N(a.m.pf)}</td><td class="n">${PCT(a.m.dd, 2)}</td><td class="n ${i ? cls(ABL[0].m.expR - a.m.expR) : ''}">${i ? (ABL[0].m.expR - a.m.expR >= 0 ? 'filter helps +' : 'filter hurts ') + N(Math.abs(ABL[0].m.expR - a.m.expR), 3) + 'R' : 'baseline'}</td></tr>`).join('')}</tbody></table></div><p class="small muted">Read this on Train only, then confirm on Validation. Differences under ~0.05R are usually noise. Removing a filter that does not help keeps the system simpler.</p></div>`;
  if (WF) h += WF.error ? `<div class="card"><h2>Walk-forward</h2><div class="banner warn">${esc(WF.error)}</div></div>` : `<div class="card"><h2>Walk-forward (3-year train → next 1-year test, rolling)</h2><div class="small muted" style="margin-bottom:10px">In each window the stop multiple (1.5/2/3 ATR) and exit method are chosen on the training years only, then applied unchanged to the next year. Holdout is never touched.</div>
    <div class="kpis">${[['Stitched out-of-sample return', SPCT(WF.tot)], ['CAGR', PCT(WF.cagr, 2)], ['Max drawdown', PCT(WF.dd, 2)], ['Trades', WF.n], ['Profit factor', N(WF.pf)], ['Expectancy', N(WF.expR) + 'R'], ['t-stat', N(WF.tR)], ['Different settings chosen', WF.stability + ' of ' + WF.windows.length]].map(k => `<div class="kpi"><span>${k[0]}</span><b>${k[1]}</b></div>`).join('')}</div>
    ${chart({ dates: WF.dates, series: [{ name: 'Walk-forward OOS equity', vals: Array.from(WF.eq, v => v / WF.eq[0] - 1), color: 'var(--accent)' }], fmt: v => (v * 100).toFixed(0) + '%', legend: true })}
    <div class="tw" style="margin-top:12px"><table><thead><tr><th>Test year</th><th>Chosen on train</th><th class="n">Train exp.</th><th class="n">Test return</th><th class="n">Test DD</th><th class="n">Test trades</th><th class="n">Test exp.</th></tr></thead><tbody>${WF.windows.map(w => `<tr><td>${fmtDate(w.test[0]).slice(3)} – ${fmtDate(w.test[1]).slice(3)}</td><td>${w.chosen.atrMult}×ATR · ${esc(EXITS[w.chosen.exitMode])}</td><td class="n">${N(w.trainExpR)}R</td><td class="n ${cls(w.testRet)}">${SPCT(w.testRet)}</td><td class="n">${PCT(w.testDD, 2)}</td><td class="n">${w.testN}</td><td class="n ${cls(w.testExpR)}">${N(w.testExpR)}R</td></tr>`).join('')}</tbody></table></div><p class="small muted">If the chosen settings jump around every year, or test years are much worse than training, the "best" parameters are noise.</p></div>`;
  return h;
}

function viewJournal() {
  if (!ENG.DATA) return `<div class="top"><h1>Journal</h1></div>` + noData();
  const ps = paperState(); const closed = ps.closed.slice().reverse(); const ts = tradeStats(ps.closed);
  let h = `<div class="top"><div><h1>Paper journal</h1><div class="sub">Replayed from your approvals against the loaded data · ${CLOUD.db ? 'synced to your account' : 'saved on this device'}</div></div><div class="row"><button class="btn sm" data-act="exportjournal">Export CSV</button><button class="btn sm" data-act="papercap">Paper capital</button></div></div>` + dataBanner();
  h += `<div class="kpis">${[['Starting capital', INR(PAPER.capital)], ['Equity now', INR(ps.equity)], ['Realised P&L', `<span class="${cls(ts.net)}">${INR(ts.net || 0)}</span>`], ['Closed trades', ts.n + (ts.n ? ' · ' + PCT(ts.winRate, 0) + ' wins' : '')]].map(k => `<div class="kpi"><span>${k[0]}</span><b>${k[1]}</b></div>`).join('')}</div>`;
  if (ps.eq.length > 5) h += `<div class="card"><h2>Paper equity</h2>${chart({ dates: ps.eqDates, series: [{ name: 'Paper equity', vals: ps.eq, color: 'var(--accent)' }], h: 180, fmt: v => '₹' + (v / 1e5).toFixed(2) + 'L' })}</div>`;
  h += `<div class="card"><h2>Open positions</h2>${ps.open.length ? `<div class="tw"><table><thead><tr><th>Stock</th><th>Entered</th><th class="n">Qty</th><th class="n">Entry</th><th class="n">Last</th><th class="n">Stop</th><th class="n">P&L</th><th></th></tr></thead><tbody>${ps.open.map(p => `<tr><td><b>${esc(p.sym)}</b>${p.exitFlag ? `<div class="small warnc">${esc(p.exitFlag)} → exit next open</div>` : ''}</td><td>${fmtDate(p.entryDate)}</td><td class="n">${p.qty}</td><td class="n">${N(p.entry)}</td><td class="n">${N(p.last)}</td><td class="n">${N(p.stop)}</td><td class="n ${cls(p.qty * p.last - p.cost)}">${INR(p.qty * p.last - p.cost)}</td><td><div class="row" style="flex-wrap:nowrap"><button class="btn sm" data-act="fill" data-id="${p.id}">Edit fill</button><button class="btn sm" data-act="close" data-id="${p.id}">Close</button><button class="btn sm" data-act="note" data-id="${p.id}">Note</button></div></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No open positions. Approve candidates on the Today tab.</div>'}</div>`;
  h += `<div class="card"><h2>Trade history</h2>${closed.length ? `<div class="tw"><table><thead><tr><th>Stock</th><th>Entry</th><th class="n">Price</th><th>Exit</th><th class="n">Price</th><th>Reason</th><th class="n">P&L</th><th class="n">R</th><th>Note</th></tr></thead><tbody>${closed.map(x => `<tr><td><b>${esc(x.sym)}</b></td><td>${fmtDate(x.entryDate)}</td><td class="n">${N(x.entry)}</td><td>${fmtDate(x.exitDate)}</td><td class="n">${N(x.exit)}</td><td class="small">${esc(x.reason)}</td><td class="n ${cls(x.pnl)}">${INR(x.pnl)}</td><td class="n">${N(x.R)}</td><td class="small"><a href="#" data-act="note" data-id="${x.id}">${esc((PAPER.notes || {})[x.id] || 'add')}</a></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No closed trades yet.</div>'}</div>`;
  if (ps.skipped.length) h += `<div class="card"><h2>Approved but not filled</h2><table><tbody>${ps.skipped.map(s => `<tr><td><b>${esc(s.sym)}</b></td><td>${fmtDate(s.sigDate)}</td><td class="small">${esc(s.why)}</td></tr>`).join('')}</tbody></table></div>`;
  return h;
}

  h += `<div class="card"><h2>3 · Capital & risk limits</h2><div class="fields">${numField('capital', 'Backtest capital (₹)', '10000')}${numField('riskPct', 'Risk per trade (% of equity)', '0.05')}${numField('maxPos', 'Max positions', '1')}${numField('maxAllocPct', 'Max per stock (% of equity)', '1')}${numField('maxDeployPct', 'Max deployed (% of equity)', '5')}${numField('maxOpenRiskPct', 'Max open risk (% of equity)', '0.1')}${numField('maxPerSector', 'Max positions per sector (0 = off)', '1')}${numField('corrMax', 'Max correlation with a holding', '0.05')}</div>${chkField('useCorr', 'Apply correlation limit (60-day returns)')}</div>`;

    const D = ENG.DATA; const cur = D ? D.dates[D.dates.length - 1] : '';
    if (!D || D.synthetic || (D.source === 'published' && PUBMAN.lastDate > cur)) {
      toast('Loading NSE data up to ' + fmtDate(PUBMAN.lastDate) + '…');
      try { await loadPublished(PUBMAN); toast('NSE data loaded · ' + ENG.UNIV.length + ' stocks'); } catch (e) { toast('Could not load published data: ' + e.message); }
    }
    render();
  }
})();

</script>
</body>
