name: Refresh NSE data
on:
  schedule:
    - cron: "17 13 * * 1-5"   # 18:47 IST, Mon–Fri, after the NSE close
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance pandas requests
      - run: python scripts/refresh.py
      - name: Commit if changed
        run: |
          git config user.name "sthir-bot"
          git config user.email "sthir-bot@users.noreply.github.com"
          git add data scripts/nifty200_fallback.csv
          git diff --cached --quiet || (git commit -m "Data refresh $(date -u +%F)" && git push)
